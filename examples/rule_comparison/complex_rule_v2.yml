title: Suspicious Command Line Pattern
id: 8f3c2f10-0000-4000-8000-000000000010
status: test
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\powershell_ise.exe'
    selection_cli:
        CommandLine|re: '(?i)(frombase64string|downloadstring|invoke-expression|iex\s*\()'
    filter:
        User: 'DOMAIN\svc_backup'
    condition: selection_img and selection_cli and not filter
level: high
